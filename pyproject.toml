[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branchcut-experiments"
version = "0.2.0"
description = "Experimenting and benchmarking suite for cutting planes and branching rules on Gurobi"
requires-python = ">=3.11"
dependencies = ["numpy", "gurobipy>=11"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
branchcut = "branchcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
